const nav=document.querySelector('nav'), card=document.querySelector('#card'), status=document.querySelector('#status');

 const node=document.createElement(tag);node.textContent=text;parent.append(node);return node;
}
const total=Object.keys(cards).length;
const tabs=Array.from({length:total},(_,i)=>{
 const button=el('button','S'+(i+1),nav);

 return button;
});
const colors=['#ff927e','#ffcf73','#b9df83','#78dbd4','#8bb9fa','#bba1fb','#f3a1d5'];
const select=id=>{
 const index=Math.max(1,Math.min(total,id))-1;
 nav.scrollTo({left:tabs[index].offsetLeft-tabs[0].offsetLeft,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
};
document.querySelector('#prev').onclick=()=>select(n-1);
document.querySelector('#next').onclick=()=>select(n+1);
let frame=0, settle=0, centered=1, syncingNav=false;
function perspective(position){
 tabs.forEach((tab,i)=>{
  const distance=i-position;
  const depth=Math.min(1,Math.abs(distance));
  tab.style.setProperty('--turn',Math.max(-38,Math.min(38,-distance*36))+'deg');
  tab.style.setProperty('--zoom',1.07-depth*.10);
  tab.style.setProperty('--fan-x',Math.max(-10,Math.min(10,-distance*9))+'px');
  tab.style.zIndex=100-Math.round(Math.abs(distance)*6);
 });
}
perspective(0);
nav.addEventListener('scroll',()=>{
 if(!frame)frame=requestAnimationFrame(()=>{
  frame=0;
  const step=tabs[1].offsetLeft-tabs[0].offsetLeft;
  const position=Math.max(0,Math.min(total-1,nav.scrollLeft/step));
  perspective(position);
  const next=Math.round(position)+1;
  if(next!==centered){
   tabs[centered-1].setAttribute('aria-current','false');
   tabs[next-1].setAttribute('aria-current','true');
   centered=next;
   document.querySelector('#deck-count').textContent=next+' / '+total;
  }
 });
 clearTimeout(settle);
 settle=setTimeout(finishNavSelection,180);
},{passive:true});
let navHeld=false;
function finishNavSelection(){
 clearTimeout(settle);
 if(navHeld || swipe || snapping)return;
 if(syncingNav){syncingNav=false;return;}
 const step=tabs[1].offsetLeft-tabs[0].offsetLeft;
 centered=Math.max(1,Math.min(total,Math.round(nav.scrollLeft/step)+1));
 if(n===centered)return;
 n=centered;updateTabs();
 card.scrollTo({left:pages[n-1].offsetLeft-pages[0].offsetLeft,behavior:'instant'});
 fitPage();
}
nav.addEventListener('pointerdown',()=>{navHeld=true;syncingNav=false;clearTimeout(settle);});
const releaseNav=()=>{
 if(!navHeld)return;
 navHeld=false;clearTimeout(settle);
 settle=setTimeout(finishNavSelection,180);
};
window.addEventListener('pointerup',releaseNav);
window.addEventListener('pointercancel',releaseNav);
nav.addEventListener('scrollend',finishNavSelection);
nav.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();select(centered+(e.key==='ArrowLeft'?-1:1));}
});
function updateTabs(){
 document.querySelector('#deck-count').textContent=n+' / '+total;
 tabs.forEach((button,i)=>{
  const id=i+1, guess=guesses[id]?.trim();
  button.textContent='S'+id; if(guess)el('span',guess,button);
  button.setAttribute('aria-current',String(id===n));
  button.style.setProperty('--color',colors[i%colors.length]);
 });
}
function buildPage(id){
 const page=el('article','',card);
 page.setAttribute('aria-label','S'+id+' 人物说明书');
 el('h2','S'+id+' · 人物说明书',page);
 const values=cards[id], list=el('dl','',page);
 fields.forEach((field,i)=>{
  const row=el('div','',list);row.className='field';
  el('dt',field,row);const detail=el('dd',values[i]||'未填写',row); if(!values[i])detail.className='empty';
  if(values[i].length>55 || values[i].split('\n').length>3){
   detail.classList.add('collapsed');
   detail.id='detail-'+id+'-'+i;
   const toggle=el('button','展开',row);
   toggle.className='expand-toggle';toggle.type='button';
   toggle.setAttribute('aria-expanded','false');
   toggle.setAttribute('aria-controls',detail.id);
   toggle.onclick=()=>{
    const expanded=toggle.getAttribute('aria-expanded')!=='true';
    toggle.setAttribute('aria-expanded',String(expanded));
    detail.classList.toggle('collapsed',!expanded);
    toggle.textContent=expanded?'收起':'展开';
   };
  }
 });
 const label=el('label','猜猜这是谁？',page);
 const input=el('input','',label);
 input.type='text';input.maxLength=30;input.placeholder='输入你猜的名字';input.value=guesses[id]||'';
 input.oninput=()=>{
  guesses[id]=input.value;updateTabs();
  try {localStorage.setItem(key,JSON.stringify(guesses));}
  catch {status.textContent='浏览器无法保存，刷新后猜测会清空。';}
 };
 el('p','猜测会自动保存在当前浏览器。',page);
 return page;
}
const motion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth';
const pages=Array.from({length:total},(_,i)=>buildPage(i+1));
function fitPage(){
 card.style.height=pages[n-1].offsetHeight+'px';
}
const resize=new ResizeObserver(fitPage);
pages.forEach(page=>resize.observe(page));
let pageFrame=0, swipe=null, snapping=false, blockClickUntil=0;
function snapTo(id){
 const start=card.scrollLeft;
 const target=pages[id-1].offsetLeft-pages[0].offsetLeft;
 const started=performance.now();
 const duration=motion()==='instant'?0:280;
 snapping=true;
 function tick(now){
  const progress=duration?Math.min(1,(now-started)/duration):1;
  card.scrollLeft=start+(target-start)*(1-Math.pow(1-progress,3));
  if(progress<1){requestAnimationFrame(tick);return;}
  n=id;centered=id;snapping=false;
  updateTabs();fitPage();
  syncingNav=true;
  nav.scrollTo({left:tabs[id-1].offsetLeft-tabs[0].offsetLeft,behavior:motion()});
 }
 requestAnimationFrame(tick);
}
card.addEventListener('pointerdown',event=>{
 if(swipingUnavailable(event))return;
 card.scrollTo({left:pages[n-1].offsetLeft-pages[0].offsetLeft,behavior:'instant'});
 swipe={id:event.pointerId,page:n,x:event.clientX,y:event.clientY,dx:0,dragging:false};
});
function swipingUnavailable(event){
 return swipe || snapping || !event.isPrimary || event.button!==0 || event.target.closest('input,button,a,textarea,select');
}
card.addEventListener('pointermove',event=>{
 if(!swipe || swipe.id!==event.pointerId)return;
 const dx=event.clientX-swipe.x, dy=event.clientY-swipe.y;
 if(!swipe.dragging){
  if(Math.abs(dy)>10 && Math.abs(dy)>Math.abs(dx)){swipe=null;return;}
  if(Math.abs(dx)<8 || Math.abs(dx)<Math.abs(dy)*1.3)return;
  swipe.dragging=true;
  card.classList.add('dragging');
  card.setPointerCapture(event.pointerId);
 }
 const step=pages[1].offsetLeft-pages[0].offsetLeft;
 swipe.dx=Math.max(-step*.95,Math.min(step*.95,dx));
 card.scrollLeft=pages[swipe.page-1].offsetLeft-pages[0].offsetLeft-swipe.dx;
});
function finishSwipe(event,cancelled){
 if(!swipe || swipe.id!==event.pointerId)return;
 const current=swipe;swipe=null;
 card.classList.remove('dragging');
 if(!current.dragging)return;
 blockClickUntil=performance.now()+350;
 const threshold=Math.min(75,card.clientWidth*.2);
 const direction=!cancelled && Math.abs(current.dx)>threshold?(current.dx<0?1:-1):0;
 snapTo(Math.max(1,Math.min(total,current.page+direction)));
}
card.addEventListener('pointerup',event=>finishSwipe(event,false));
card.addEventListener('pointercancel',event=>finishSwipe(event,true));
card.addEventListener('lostpointercapture',event=>finishSwipe(event,true));
card.addEventListener('click',event=>{
 if(performance.now()<blockClickUntil){event.preventDefault();event.stopPropagation();}
},true);
card.addEventListener('scroll',()=>{
 if(pageFrame || swipe || snapping)return;
 pageFrame=requestAnimationFrame(()=>{
  pageFrame=0;
  if(swipe || snapping)return;
  const step=pages[1].offsetLeft-pages[0].offsetLeft;
  const next=Math.max(1,Math.min(total,Math.round(card.scrollLeft/step)+1));
  if(next===n)return;
  n=next;centered=n;updateTabs();fitPage();
  syncingNav=true;
  nav.scrollTo({left:tabs[n-1].offsetLeft-tabs[0].offsetLeft,behavior:'instant'});
 });
},{passive:true});
window.addEventListener('resize',()=>{
 card.scrollTo({left:pages[n-1].offsetLeft-pages[0].offsetLeft,behavior:'instant'});
 fitPage();
});
updateTabs();fitPage();
</script></html>
